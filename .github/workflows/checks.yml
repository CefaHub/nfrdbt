name: Code checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q main.py radar.py mint_radar.py gen_session.py check_network.py tests
      - name: Test pure scanning state and attributes
        run: python -m unittest discover -s tests -v
