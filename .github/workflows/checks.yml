name: Code checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q main.py radar.py mint_radar.py live_market.py see_live.py delivery.py deal_watch.py owner_contact.py gift_origin.py gift_host.py candidate_selection.py activation.py gen_session.py check_network.py tests
      - name: Install runtime dependencies for notification tests
        run: python -m pip install -r requirements.txt
      - name: Test Gift Radar logic and Telegram send arguments
        run: python -m unittest discover -s tests -v
